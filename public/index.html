<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Attention Test</title>
<style>
  /* Direction: DESIGN.md. Paper, ink, one orange accent. Flat surfaces, no glass or glow. */
  @font-face { font-family:"Nunito"; src:url(fonts/nunito-latin.woff2) format("woff2"); font-weight:400 800; font-display:swap; }
  :root {
    --paper:#FBF8F1; --card:#FFFFFF; --ink:#1F2A33; --mute:#4F5B66; --line:#E3DCCD; --edge:#8A8274;
    --accent:#C2410C; --accent-deep:#8F2F08; --on:#FFFFFF; --bad:#B3261E; --tint:rgba(194,65,12,.1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) { :root {
    --paper:#1B1A17; --card:#25231F; --ink:#F3EEE4; --mute:#C2BBAD; --line:#3A362F; --edge:#8F8777;
    --accent:#FB923C; --accent-deep:#B45309; --on:#1B1A17; --bad:#FF9A92; --tint:rgba(251,146,60,.14);
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:400 1.25rem/1.5 "Nunito", system-ui, sans-serif; }
  header { border-bottom:2px solid var(--line); }
  .hd { max-width:680px; margin:0 auto; padding:12px 16px; display:flex; flex-direction:column; }
  .hd b { display:block; font-weight:800; line-height:1.2; } .hd small { color:var(--mute); font-size:1rem; }
  main { max-width:680px; margin:0 auto; padding:16px 12px 48px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:18px; }
  h1 { font-size:clamp(1.55rem, 1.2rem + 1.6vw, 2rem); line-height:1.2; font-weight:800; margin:0 0 8px; }
  h2 { font-size:1.2rem; font-weight:800; margin:20px 0 6px; }
  p, li { color:var(--mute); } li { margin:8px 0; } ul { padding-left:22px; margin:6px 0 18px; }
  label b { font-weight:800; }
  input, button { font:inherit; border-radius:12px; border:2px solid var(--edge); background:var(--card); color:var(--ink); }
  input { width:100%; padding:14px 16px; margin-top:6px; }
  button { padding:14px 22px; min-height:56px; font-weight:700; cursor:pointer; touch-action:manipulation; }
  button:hover:not(:disabled):not(.primary) { background:var(--tint); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  button.primary { background:var(--accent); border-color:var(--accent-deep); color:var(--on); box-shadow:0 4px 0 var(--accent-deep); transition:transform .1s, box-shadow .1s; }
  button.primary:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.on { border-color:var(--accent); border-width:3px; background:var(--tint); }
  .err { color:var(--bad); min-height:1.5em; margin:8px 0; font-weight:700; }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  nav button { width:44px; height:44px; min-height:44px; padding:0; border-radius:50%; font-size:1rem; font-weight:800; }
  nav .done { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  nav .cur { border-color:var(--accent); border-width:4px; }
  .meta { color:var(--mute); font-size:1rem; font-weight:700; margin-bottom:6px; }
  .pic { position:relative; touch-action:manipulation; user-select:none; margin-top:12px; cursor:crosshair; }
  .pic img { width:100%; display:block; border-radius:12px; background:#fff; min-height:150px; border:2px solid var(--line); }
  .dot { position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border:4px solid var(--accent); border-radius:50%; background:var(--tint); box-shadow:0 0 0 3px #fff; pointer-events:none; animation:pop .18s ease-out; }
  @keyframes pop { from { transform:scale(.5); opacity:0; } }
  .row { display:flex; gap:12px; margin-top:16px; } .row > * { flex:1; }
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:16px 0 0; }
  .grid button { padding:8px; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
  .grid .num { font-size:1.1rem; font-weight:800; }
  .grid img { width:100%; max-width:120px; aspect-ratio:1; object-fit:contain; background:#fff; border-radius:8px; pointer-events:none; }
  .grid button.on::after { content:"\2713"; position:absolute; top:4px; right:6px; font-weight:800; color:var(--accent); }
  .rev { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:2px solid var(--line); }
  .rev span.no { color:var(--bad); font-weight:800; } .rev span.ok { color:var(--ink); font-weight:800; }
  .rev button { min-height:44px; padding:4px 16px; }
  .center { text-align:center; padding:40px 18px; }
  @media (min-width:600px) { .card { padding:28px; } main { padding-top:24px; } }
  @media (max-width:420px) { main { padding-left:8px; padding-right:8px; } nav { gap:4px; } .grid { gap:6px; } .grid button { padding:6px 2px; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header id="hd" hidden><div class="hd"><div><b id="title"></b><small id="who"></small></div></div></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const KEY = 'seetest';
// Each student sees the questions in their own order (seeded by ID, so a reload keeps it).
function rng(seed) {
  let h = 1779033703;
  for (const c of seed) { h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
const shuffle = (a, r) => { a = [...a]; for (let i = a.length; i > 1;) { const j = Math.floor(r() * i--); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let S = { token: null, cur: 0, answers: { objects: {}, shapes: {} } };
let Q, items, submitting = false;
const store = (v) => { try { v === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
const save = () => store({ token: S.token, cur: S.cur, answers: S.answers });
const load0 = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };

async function call(url, body) {
  const r = await fetch(url, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', 'x-token': S.token || '' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || 'Something went wrong. Try again.'), { status: r.status });
  return data;
}

function loginScreen(msg = '') {
  $('#hd').hidden = true;
  app.innerHTML = `<div class="card">
    <h1>👋 Visual Attention Test</h1><p>Take your time. Enter your student ID to begin.</p>
    <h2>Before you start</h2>
    <ul>
      <li>Press <b>Start</b> when you are ready.</li>
      <li>Each student ID can be used <b>only once</b>. If the page closes, open it again on the same device to carry on.</li>
      <li>9 picture questions: tap the object if you can see it. If it is not there, press “No …”.</li>
      <li>3 shape questions: tap the red shape that is hidden in the drawing.</li>
      <li>You can go back and change an answer until you submit.</li>
    </ul>
    <label for="id"><b>Student ID</b></label>
    <input id="id" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 2301045">
    <p class="err" id="err" role="alert">${msg}</p>
    <button class="primary" id="go" style="width:100%">Log in</button></div>`;
  $('#id').focus();
  const go = async () => {
    $('#go').disabled = true;
    try {
      S = { token: (await call('/api/login', { id: $('#id').value })).token, cur: 0, answers: { objects: {}, shapes: {} } };
      save();
      start();
    } catch (e) { loginScreen(e.message); }
  };
  $('#go').onclick = go;
  $('#id').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

async function start() {
  try { Q = await call('/api/questions'); }
  catch (e) { store(null); return loginScreen(e.status === 401 ? '' : e.message); }
  if (Q.submitted) return done();
  const id = S.token.split('.')[0];
  if (Q.notStarted) return readyScreen(id);
  const r = rng(id);
  if (Array.isArray(S.answers.shapes)) S.answers.shapes = {}; // saved by an older version of the page
  items = [...shuffle(Q.objects, r).map((q) => ({ q })), ...Q.shapes.map((q, n) => ({ shape: q, n: n + 1, options: shuffle(Q.options, r) }))];
  $('#title').textContent = Q.title; $('#who').textContent = 'Student ID: ' + id; $('#hd').hidden = false;
  window.onbeforeunload = (e) => { if (!submitting) { e.preventDefault(); e.returnValue = ''; } };
  S.cur = Math.min(S.cur, items.length);
  render();
}

function readyScreen(id, msg = '') {
  app.innerHTML = `<div class="card center"><h1>You are logged in</h1><p>Student ID: <b>${id}</b></p><p>Take your time. Press Start when you are ready.</p>
    <p class="err" id="err" role="alert">${msg}</p>
    <button class="primary" id="begin" style="width:100%">Start test</button></div>`;
  $('#begin').onclick = async () => {
    $('#begin').disabled = true;
    try { await call('/api/start', {}); start(); } catch (e) { readyScreen(id, e.message); }
  };
}

const answered = (i) => items[i].shape ? !!S.answers.shapes[items[i].shape.id] : !!S.answers.objects[items[i].q.id];
const go = (i) => { S.cur = i; save(); render(); window.scrollTo(0, 0); };

function navHtml() {
  return `<nav aria-label="Questions">${items.map((_, i) =>
    `<button data-i="${i}" class="${answered(i) ? 'done' : ''} ${i === S.cur ? 'cur' : ''}" aria-label="Question ${i + 1}${answered(i) ? ', answered' : ''}">${i + 1}</button>`).join('')}
    <button data-i="${items.length}" class="${S.cur === items.length ? 'cur' : ''}" aria-label="Review">✓</button></nav>`;
}
function wireNav() { document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => go(+b.dataset.i))); }

function render() {
  if (S.cur >= items.length) return review();
  const it = items[S.cur], last = S.cur === items.length - 1;
  app.innerHTML = `${navHtml()}<div class="card"><div class="meta">Question ${S.cur + 1} of ${items.length}</div>
    <div id="body"></div>
    <div class="row"><button id="back" ${S.cur ? '' : 'disabled'}>Back</button>
    <button id="next" class="primary">${last ? 'Review answers' : 'Next'}</button></div></div>`;
  wireNav();
  it.shape ? shapeQ(it) : objectQ(it.q);
  $('#back').onclick = () => go(S.cur - 1);
  $('#next').onclick = () => go(S.cur + 1);
}

function objectQ(q) {
  $('#body').innerHTML = `<h1>${{ bucket: '🪣', wrench: '🔧', cycle: '🚲' }[q.object] || ''} Can you see the ${q.object}?</h1><p>Tap the ${q.object} in the picture. If there is no ${q.object}, press “No ${q.object}”.</p>
    <div class="pic"><img src="${q.img}" alt="Picture ${S.cur + 1}" draggable="false"></div>
    <div class="row"><button id="none">No ${q.object}</button></div>`;
  const pic = $('.pic'), img = $('.pic img'), a = () => S.answers.objects[q.id];
  const mark = (x, y) => {
    pic.querySelectorAll('.dot').forEach((d) => d.remove());
    const d = document.createElement('div');
    d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px';
    pic.append(d);
  };
  const showSaved = () => { if (a() && !a().none) mark(a().x * img.clientWidth, a().y * img.clientWidth); };
  $('#none').classList.toggle('on', !!(a() && a().none));
  showSaved(); img.onload = showSaved;
  pic.onclick = (e) => {
    const r = img.getBoundingClientRect();
    S.answers.objects[q.id] = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.width };
    $('#none').classList.remove('on'); mark(e.clientX - r.left, e.clientY - r.top); save(); refreshNav();
  };
  $('#none').onclick = () => {
    S.answers.objects[q.id] = { none: true };
    pic.querySelectorAll('.dot').forEach((d) => d.remove());
    $('#none').classList.add('on'); save(); refreshNav();
  };
}

function shapeQ(it) {
  const id = it.shape.id, a = () => S.answers.shapes[id];
  $('#body').innerHTML = `<h1>Shape ${it.n}</h1><p>Find the shape. Tap the red shape that is hidden in this drawing.</p>
    <div class="pic" style="cursor:default;max-width:340px;margin:12px auto 0"><img src="${it.shape.img}" alt="Drawing for shape ${it.n}" draggable="false"></div>
    <div class="grid">${it.options.map((o, i) => `<button data-s="${o.id}" aria-label="Option ${i + 1}" aria-pressed="${a() === o.id}" class="${a() === o.id ? 'on' : ''}">
      <b class="num" aria-hidden="true">${i + 1}.</b><img src="${o.img}" alt="" draggable="false"></button>`).join('')}</div>`;
  document.querySelectorAll('.grid button').forEach((b) => {
    b.onclick = () => {
      S.answers.shapes[id] = b.dataset.s;
      document.querySelectorAll('.grid button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
      save(); refreshNav();
    };
  });
}

function refreshNav() {
  document.querySelectorAll('nav button').forEach((b, i) => { if (i < items.length) b.classList.toggle('done', answered(i)); });
}

function review() {
  const missing = items.filter((_, i) => !answered(i)).length;
  app.innerHTML = `${navHtml()}<div class="card"><h1>Review your answers</h1>
    <p>${missing ? `<b style="color:var(--bad)">${missing} question${missing > 1 ? 's' : ''} not answered.</b> You can still go back.` : 'All ' + items.length + ' questions are answered.'}</p>
    ${items.map((_, i) => `<div class="rev"><span>Question ${i + 1}</span><span class="${answered(i) ? 'ok' : 'no'}">${answered(i) ? '✓ Answered' : 'Not answered'}</span><button data-i="${i}">Open</button></div>`).join('')}
    <p class="err" id="err" role="alert"></p>
    <div class="row"><button id="back">Back</button><button id="submit" class="primary">Submit test</button></div></div>`;
  wireNav();
  document.querySelectorAll('.rev button').forEach((b) => (b.onclick = () => go(+b.dataset.i)));
  $('#back').onclick = () => go(items.length - 1);
  $('#submit').onclick = () => {
    $('#submit').outerHTML = '<button id="sure" class="primary">Yes, submit. I cannot change it after.</button>';
    $('#sure').onclick = () => submit();
  };
}

async function submit() {
  submitting = true;
  app.innerHTML = `<div class="card center"><h1>Submitting</h1><p>Saving your answers. Do not close this page.</p><p class="err" id="err" role="alert"></p></div>`;
  for (let n = 0; n < 5; n++) {
    try { await call('/api/submit', S.answers); return done(); }
    catch (e) {
      if (e.status === 409 || e.status === 401) return done(); // already saved
      $('#err').textContent = 'No connection. Trying again…';
      await new Promise((r) => setTimeout(r, 2000));
    }
  }
  submitting = false;
  app.innerHTML = '<div class="card center"><h1>Not saved yet</h1><p>Check your connection, then press the button.</p><button class="primary" id="retry">Try again</button></div>';
  $('#retry').onclick = () => submit();
}

function done() {
  window.onbeforeunload = null; store(null);
  $('#hd').hidden = true;
  app.innerHTML = '<div class="card center"><h1>🎉 Test submitted</h1><p>You finished. Thank you! Your answers are saved and you can close this page.</p></div>';
}

const saved = load0();
if (saved && saved.token) { S = { ...S, ...saved }; start(); } else loginScreen();
</script>
</body>
</html>
